<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy — restricts what this page's own JS can load/connect to.
      Delivered as a <meta> tag because this project is not deployed behind a server
      that can set real HTTP headers. A true HTTP header (e.g. via vercel.json "headers"
      or an Express helmet() call on a static-file server) is preferable if deployment
      infrastructure allows it later — a meta tag can theoretically be stripped by a
      compromised page before it takes effect, which is not possible with a real header.

      connect-src lists every origin this page's own fetch() calls directly:
        - https://privacy-preserving-decentralised-health.onrender.com — the production
          backend API (VITE_API_URL in Vercel's environment variables)
        - https://*.mypinata.cloud — Pinata IPFS gateway (VITE_IPFS_GATEWAY_1)
        - https://ipfs.io, https://dweb.link, https://w3s.link, https://4everland.io —
          the four public IPFS gateways used alongside Pinata for Phase 4's k-set
          Byzantine consensus check (VITE_IPFS_GATEWAY_2 through _5)
      The Sepolia RPC provider is deliberately excluded — window.ethereum.request() is
      handled by the MetaMask extension's isolated context and never goes through the
      page's own fetch/XHR, so connect-src does not govern it and adding it would grant
      an unnecessary permission to a channel this page never uses directly.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src  'self';
      style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src    'self' https://fonts.gstatic.com;
      img-src     'self' data: blob:;
      connect-src 'self' https://privacy-preserving-decentralised-health.onrender.com https://*.mypinata.cloud https://ipfs.io https://dweb.link https://w3s.link https://4everland.io;
      object-src  'none';
      frame-src   'none';
    " />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinical Ledger | Health Blockchain HIE</title>
    <!-- Fonts loaded once here — never inside React components -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
